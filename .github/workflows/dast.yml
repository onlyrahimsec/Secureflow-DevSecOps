name: DAST - OWASP ZAP

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install application dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # 4. Start Flask application
      # ---------------------------------------------------------
      - name: Start Flask application
        working-directory: app
        run: |
          nohup python app.py > flask.log 2>&1 &

      # ---------------------------------------------------------
      # 5. Wait for application to become available
      # ---------------------------------------------------------
      - name: Wait for application
        run: |
          echo "Waiting for Flask application..."

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting... attempt $i/30"
            sleep 2
          done

          echo "Application failed to start."
          cat app/flask.log
          exit 1

      # ---------------------------------------------------------
      # 6. Run OWASP ZAP Baseline Scan
      # ---------------------------------------------------------
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:5000"
          allow_issue_writing: true
          fail_action: false

      # ---------------------------------------------------------
      # 7. Upload Flask logs
      # ---------------------------------------------------------
      - name: Upload Flask logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flask-logs
          path: app/flask.log
          if-no-files-found: warn

      # ---------------------------------------------------------
      # 8. Upload ZAP reports
      # ---------------------------------------------------------
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_html.html
            report_md.md
            report_xml.xml
          if-no-files-found: warn
