name: DAST - OWASP ZAP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # 1. Checkout source code
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Setup Python
      # --------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------
      # 3. Install dependencies
      # --------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt


      # --------------------------------
      # 4. Start Flask application
      # --------------------------------
      - name: Start Flask application
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python app/app.py > flask.log 2>&1 &
          echo $! > flask.pid


      # --------------------------------
      # 5. Wait for application
      # --------------------------------
      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for Flask application..."
            sleep 2
          done

          echo "Application failed to start."
          cat flask.log
          exit 1


      # --------------------------------
      # 6. Run OWASP ZAP Baseline Scan
      # --------------------------------
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:5000"


      # --------------------------------
      # 7. Upload Flask logs if needed
      # --------------------------------
      - name: Upload Flask logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flask-logs
          path: flask.log
