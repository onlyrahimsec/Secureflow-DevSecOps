name: Security Scanning

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  # ============================================================
  # SP3 — Security Regression Tests
  # ============================================================

  security-tests:
    name: Security Regression Tests
    runs-on: ubuntu-latest

    env:
      # CI-only Flask secret.
      # Never use this value in production.
      SECRET_KEY: "secureflow-ci-test-secret-key-2026"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run security regression tests
        run: |
          pytest -v


  # ============================================================
  # SP4 — CodeQL Security Analysis
  # ============================================================

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4


  # ============================================================
  # SP4 — Security Quality Gate
  # ============================================================

  security-gate:
    name: Security Quality Gate
    runs-on: ubuntu-latest

    needs:
      - security-tests
      - codeql

    if: ${{ always() }}

    steps:

      - name: Check security test result
        env:
          SECURITY_TEST_RESULT: ${{ needs.security-tests.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}

        run: |

          echo "=========================================="
          echo "       SecureFlow Security Quality Gate"
          echo "=========================================="
          echo ""

          echo "Security Tests: ${SECURITY_TEST_RESULT}"
          echo "CodeQL Analysis: ${CODEQL_RESULT}"
          echo ""

          if [ "${SECURITY_TEST_RESULT}" != "success" ]; then
            echo "❌ Security regression tests failed."
            echo "Security Quality Gate: FAILED"
            exit 1
          fi

          if [ "${CODEQL_RESULT}" != "success" ]; then
            echo "❌ CodeQL analysis failed."
            echo "Security Quality Gate: FAILED"
            exit 1
          fi

          echo "✓ Security regression tests passed."
          echo "✓ CodeQL analysis completed."
          echo ""

          echo "=========================================="
          echo "Security Quality Gate: PASSED"
          echo "=========================================="


  # ============================================================
  # SP5 — OWASP ZAP DAST Scan
  # ============================================================

  zap-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "secureflow-ci-test-secret-key-2026"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Start SecureFlow application
        run: |
          nohup python app/app.py > secureflow.log 2>&1 &

      - name: Wait for SecureFlow
        run: |

          for i in {1..30}; do

            if curl -fsS http://127.0.0.1:5000/health; then
              echo ""
              echo "SecureFlow is ready."
              exit 0
            fi

            echo "Waiting for SecureFlow..."
            sleep 2

          done

          echo "SecureFlow failed to start."
          echo ""
          echo "Application log:"
          cat secureflow.log

          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:5000"
          allow_issue_writing: false
          artifact_name: "zap-scan"

      - name: Upload SecureFlow application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureflow-application-log
          path: secureflow.log
          if-no-files-found: ignore


  # ============================================================
  # SP5 — DAST Security Quality Gate
  # ============================================================

  zap-gate:
    name: DAST Security Quality Gate
    runs-on: ubuntu-latest

    needs:
      - zap-scan

    if: ${{ always() }}

    steps:

      - name: Check ZAP result
        env:
          ZAP_RESULT: ${{ needs.zap-scan.result }}

        run: |

          echo "=========================================="
          echo "        SecureFlow DAST Quality Gate"
          echo "=========================================="
          echo ""

          echo "OWASP ZAP Scan: ${ZAP_RESULT}"
          echo ""

          if [ "${ZAP_RESULT}" != "success" ]; then
            echo "❌ OWASP ZAP security scan failed."
            echo "DAST Security Quality Gate: FAILED"
            exit 1
          fi

          echo "✓ OWASP ZAP scan completed successfully."
          echo ""

          echo "=========================================="
          echo "DAST Security Quality Gate: PASSED"
          echo "=========================================="


  # ============================================================
  # SP6 — Software Composition Analysis
  # ============================================================

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "secureflow-ci-test-secret-key-2026"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip-audit

      # ----------------------------------------------------------
      # SP6 — Dependency Vulnerability Scan
      # ----------------------------------------------------------

      - name: Run dependency vulnerability scan
        run: |

          echo "=========================================="
          echo "      SecureFlow Dependency Audit"
          echo "=========================================="
          echo ""

          echo "Auditing dependencies from:"
          echo "app/requirements.txt"
          echo ""

          pip-audit \
            -r app/requirements.txt \
            --desc \
            --format columns

          echo ""
          echo "=========================================="
          echo "Dependency audit completed."
          echo "=========================================="

      # ----------------------------------------------------------
      # SP6 — JSON Security Report
      # ----------------------------------------------------------

      - name: Generate dependency security report
        if: always()
        run: |

          pip-audit \
            -r app/requirements.txt \
            --format=json \
            --output=pip-audit-report.json || true

      # ----------------------------------------------------------
      # SP6 — Upload Security Report
      # ----------------------------------------------------------

      - name: Upload dependency security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-security-report
          path: pip-audit-report.json
          if-no-files-found: ignore


  # ============================================================
  # SP6 — SCA Security Quality Gate
  # ============================================================

  dependency-gate:
    name: SCA Security Quality Gate
    runs-on: ubuntu-latest

    needs:
      - dependency-scan

    if: ${{ always() }}

    steps:

      - name: Check dependency scan result
        env:
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}

        run: |

          echo "=========================================="
          echo "        SecureFlow SCA Quality Gate"
          echo "=========================================="
          echo ""

          echo "Dependency Scan: ${DEPENDENCY_SCAN_RESULT}"
          echo ""

          if [ "${DEPENDENCY_SCAN_RESULT}" != "success" ]; then
            echo "❌ Dependency vulnerability scan failed."
            echo "SCA Security Quality Gate: FAILED"
            exit 1
          fi

          echo "✓ Dependency vulnerability scan passed."
          echo ""

          echo "=========================================="
          echo "SCA Security Quality Gate: PASSED"
          echo "=========================================="
