name: Security Scanning

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  # ============================================================
  # SP3 — Security Regression Tests
  # ============================================================

  security-tests:
    name: Security Regression Tests
    runs-on: ubuntu-latest

    env:
      # CI-only Flask secret.
      # Never use this value in production.
      SECRET_KEY: "secureflow-ci-test-secret-key-2026"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run security regression tests
        run: |
          pytest -v

  # ============================================================
  # SP4 — CodeQL Security Analysis
  # ============================================================

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ============================================================
  # SP4 — Security Quality Gate
  # ============================================================

  security-gate:
    name: Security Quality Gate
    runs-on: ubuntu-latest

    needs:
      - security-tests
      - codeql

    if: ${{ always() }}

    steps:

      - name: Check security test result
        env:
          SECURITY_TEST_RESULT: ${{ needs.security-tests.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}

        run: |
          echo "=========================================="
          echo "       SecureFlow Security Quality Gate"
          echo "=========================================="
          echo ""

          echo "Security Tests: ${SECURITY_TEST_RESULT}"
          echo "CodeQL Analysis: ${CODEQL_RESULT}"
          echo ""

          if [ "${SECURITY_TEST_RESULT}" != "success" ]; then
            echo "❌ Security regression tests failed."
            echo "Security Quality Gate: FAILED"
            exit 1
          fi

          if [ "${CODEQL_RESULT}" != "success" ]; then
            echo "❌ CodeQL analysis failed."
            echo "Security Quality Gate: FAILED"
            exit 1
          fi

          echo "✓ Security regression tests passed."
          echo "✓ CodeQL analysis completed."
          echo ""
          echo "=========================================="
          echo "Security Quality Gate: PASSED"
          echo "=========================================="
